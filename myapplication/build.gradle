plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  compileSdkVersion 31
  buildToolsVersion "30.0.3"

  // 系统签名配置
  signingConfigs {
    system {
      keyAlias 'mykey'
      keyPassword 'hht2020'
      storeFile file("${rootDir}/hht.keystore")
      storePassword 'hht2020'
    }
    platform24 {
      keyAlias 'mykey'
      keyPassword 'hht2020'
      storeFile file("${rootDir}/24platform.keystore")
      storePassword 'hht2020'
    }
  }

  defaultConfig {
    applicationId "com.ghb.cry.app"
    minSdkVersion 24
    targetSdkVersion 31
    // 动态生成基于日期的版本号
    def date = new Date()
    def year = date.format('yy')
    def month = date.format('MM')
    def day = date.format('dd')
    
    versionCode "${year}${month}${day}".toInteger()
    versionName "${year}.${month}.${day}"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    
    // 配置NDK，指定支持的CPU架构
    ndk {
      abiFilters 'armeabi-v7a', 'arm64-v8a'
    }
  }
  
  // 确保jniLibs直接指向我们包含SO文件的libs目录
  sourceSets {
    main {
      // 明确指定jniLibs目录，确保直接使用提取的SO文件
      jniLibs.srcDirs = ['libs']
    }
  }

  // 配置packagingOptions，确保native库正确打包
  packagingOptions {
    doNotStrip "**/*.so"
    pickFirst "**/*.so"
    // 确保所有so库都被包含，不排除任何架构
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/NOTICE'
  }

  // 添加flatDir配置来处理本地AAR文件
  repositories {
    flatDir {
      dirs 'libs', '../libcry/libs'
    }
  }

  // 声明渠道维度
  flavorDimensions "signing"

  // 配置产品渠道
  productFlavors {
    // 默认渠道，使用system签名
    defaultSigning {
      dimension "signing"
    }
    // platform24渠道，用于不同设备
    platform24 {
      dimension "signing"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
    }
  }

  // 直接在productFlavors中配置签名
  productFlavors.defaultSigning {
    signingConfig signingConfigs.system
  }
  productFlavors.platform24 {
    signingConfig signingConfigs.platform24
  }

  // 配置APK文件名格式为Cry-渠道-版本号.apk
  android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
      def flavorName = variant.productFlavors[0].name
      def versionName = variant.versionCode
      // 替换文件名格式
      output.outputFileName = "Cry-${flavorName}-${versionName}.apk"
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
//  implementation project(':libcry')
  // 直接引入libnetpie.aar文件
  implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
  implementation 'com.controller.lib:ControllerDM:1.0.4'
  implementation 'androidx.appcompat:appcompat:1.0.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}